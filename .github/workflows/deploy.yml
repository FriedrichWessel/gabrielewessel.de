name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Set this to your default branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Pages
        uses: actions/configure-pages@v3
      
      - name: Copy files to build directory
        run: |
          mkdir -p build
          cp -r src/* build/
          cp CNAME build/
          cp -r assets build/
      
      - name: Fix asset paths
        run: |
          find build -type f -name "*.html" -exec sed -i 's|../assets|assets|g' {} \;
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: 'build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
